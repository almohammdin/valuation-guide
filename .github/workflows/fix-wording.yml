name: One-time wording fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wording.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          updated = text.replace('هذه الأداة', 'الأداة')
          if updated == text:
              raise SystemExit('No matching wording found')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: simplify tool wording"
          git push
